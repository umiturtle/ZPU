name: CI

on:
  push:
    branches: [ main, arena/* ]
  pull_request:
    branches: [ main ]

env:
  ZIG_VERSION: 0.17.0

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: ${{ env.ZIG_VERSION }}
    
    - name: Run tests
      run: zig build test
    
    - name: Check formatting
      run: zig fmt --check src/ examples/
      continue-on-error: true

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: ${{ env.ZIG_VERSION }}
    
    - name: Build benchmark
      run: |
        zig build-exe --dep zpu \
          -Mroot=bench/comprehensive.zig \
          -Mzpu=src/zpu.zig \
          -OReleaseSafe \
          -lc \
          -femit-bin=bench/comprehensive
    
    - name: Run benchmark
      run: ./bench/comprehensive
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: bench/comprehensive
      continue-on-error: true

  build-examples:
    name: Build Examples
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: ${{ env.ZIG_VERSION }}
    
    - name: Build UI v2 Demo
      run: zig build run-ui-v2-demo
    
    - name: Build Vector Demo
      run: zig build run-vector-demo
    
    - name: Upload snapshots
      uses: actions/upload-artifact@v4
      with:
        name: snapshots
        path: snapshots/

  build-web:
    name: Build WebAssembly
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: ${{ env.ZIG_VERSION }}
    
    - name: Build WASM
      run: |
        zig build-exe examples/web/wasm_ui.zig \
          -target wasm32-freestanding \
          -O ReleaseSmall \
          -fno-entry \
          --export-all \
          -o zig-out/ui.wasm
      continue-on-error: true
    
    - name: Upload WASM
      uses: actions/upload-artifact@v4
      with:
        name: wasm
        path: zig-out/

  snapshot-compare:
    name: Snapshot Comparison
    runs-on: ubuntu-latest
    needs: [test, build-examples]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: pip install Pillow numpy
    
    - name: Download snapshots
      uses: actions/download-artifact@v4
      with:
        name: snapshots
        path: snapshots/
    
    - name: Run snapshot comparison
      run: python examples/snapshot_compare_test.py

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [test, build-examples, build-web]
    if: github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Pages
      uses: actions/configure-pages@v4
    
    - name: Download WASM
      uses: actions/download-artifact@v4
      with:
        name: wasm
        path: examples/web/
      continue-on-error: true
    
    - name: Prepare site
      run: |
        mkdir -p _site
        cp -r examples/web/* _site/
        cp -r snapshots _site/
    
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site
    
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
