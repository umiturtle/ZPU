<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAPP UI v2 - Interactive Demo (WebAssembly)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            min-height: 100vh;
            padding: 2rem;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        
        .subtitle {
            color: #888;
            font-size: 1.1rem;
        }
        
        .demo-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 2rem;
        }
        
        .demo-section h2 {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            color: #4facfe;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 8px;
            background: #1e1e2e;
            image-rendering: pixelated;
        }
        
        .controls {
            margin-top: 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        
        button {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        
        button.primary {
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            color: #fff;
        }
        
        button.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #eee;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 172, 254, 0.3);
        }
        
        .label {
            display: block;
            margin-bottom: 0.25rem;
            color: #aaa;
            font-size: 0.9rem;
        }
        
        input[type="range"] {
            width: 100%;
            margin: 0.5rem 0;
        }
        
        input[type="checkbox"] {
            margin-right: 0.5rem;
        }
        
        .status {
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            background: rgba(79, 172, 254, 0.1);
            border-radius: 6px;
            font-size: 0.9rem;
            color: #4facfe;
        }
        
        .status.error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }
        
        footer {
            text-align: center;
            margin-top: 3rem;
            color: #666;
            font-size: 0.9rem;
        }
        
        a {
            color: #4facfe;
            text-decoration: none;
        }
        
        a:hover {
            text-decoration: underline;
        }
        
        .badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            background: rgba(79, 172, 254, 0.2);
            border-radius: 4px;
            font-size: 0.8rem;
            margin-left: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>ZAPP UI v2 <span class="badge">WebAssembly</span></h1>
            <p class="subtitle">Declarative UI rendered by the same Zig code as desktop</p>
        </header>
        
        <div class="demo-section">
            <h2>🖥️ UI Rendered by WASM</h2>
            <canvas id="ui-canvas" width="800" height="400"></canvas>
            <div class="controls">
                <button class="primary" onclick="renderUI()">Render</button>
                <button class="secondary" onclick="toggleTheme()">Toggle Theme</button>
                <button class="secondary" onclick="exportPNG()">Export PNG</button>
            </div>
            <div id="status" class="status">Loading WASM module...</div>
        </div>
        
        <div class="demo-section">
            <h2>🎛️ Interactive Controls</h2>
            <label class="label">Volume</label>
            <input type="range" id="volume-slider" min="0" max="100" value="70" oninput="updateVolume(this.value)">
            
            <label class="label">
                <input type="checkbox" id="enable-check" checked onchange="updateEnabled(this.checked)">
                Enable Feature
            </label>
            
            <label class="label">Progress</label>
            <input type="range" id="progress-slider" min="0" max="100" value="75" oninput="updateProgress(this.value)">
        </div>
        
        <footer>
            <p>Built with ZAPP UI v2 • Same Zig code as desktop • <a href="https://github.com/umiturtle/ZPU">GitHub</a></p>
            <p>WebAssembly • Vector-rendered components • Declarative DSL • Type-safe</p>
        </footer>
    </div>
    
    <script>
        let wasmInstance = null;
        let canvas, ctx;
        
        async function init() {
            canvas = document.getElementById('ui-canvas');
            ctx = canvas.getContext('2d');
            
            const statusEl = document.getElementById('status');
            
            try {
                // Load WASM module using relative path
                const response = await fetch('ui.wasm');
                
                if (!response.ok) {
                    throw new Error(`Failed to fetch WASM: ${response.status}`);
                }
                
                const wasmBytes = await response.arrayBuffer();
                console.log('WASM bytes loaded:', wasmBytes.byteLength);
                
                const { instance } = await WebAssembly.instantiate(wasmBytes, {
                    env: {
                        // WASM imports if needed
                    }
                });
                
                wasmInstance = instance;
                
                console.log('WASM exports:', Object.keys(instance.exports));
                
                // Initialize the UI
                const width = 800;
                const height = 400;
                instance.exports.init(width, height);
                
                // Check if memory is exported
                if (instance.exports.memory) {
                    console.log('WASM memory exported, buffer size:', instance.exports.memory.buffer.byteLength);
                } else {
                    console.error('WASM memory NOT exported');
                }
                
                // Render initial UI
                renderUI();
                
                statusEl.textContent = '✓ WASM module loaded successfully';
                statusEl.className = 'status';
                
            } catch (error) {
                console.error('Failed to load WASM:', error);
                statusEl.textContent = `✗ Failed to load WASM: ${error.message}`;
                statusEl.className = 'status error';
                
                // Fall back to canvas-only rendering
                renderFallback();
            }
        }
        
        function renderUI() {
            if (!wasmInstance) {
                console.warn('WASM not loaded');
                return;
            }
            
            try {
                // Call the render function
                wasmInstance.exports.renderUI();
                
                // Get the pixel buffer pointer (it's an i32, returned as number)
                const ptr = wasmInstance.exports.getFrameBufferPtr();
                const size = wasmInstance.exports.getFrameBufferSize();
                
                console.log('WASM render: ptr =', ptr, 'size =', size);
                
                if (ptr === null || ptr === undefined || ptr === 0 || size === 0) {
                    console.error('Invalid frame buffer: ptr=', ptr, 'size=', size);
                    return;
                }
                
                // Read pixels from WASM memory
                const memory = wasmInstance.exports.memory;
                if (!memory) {
                    console.error('WASM memory not exported');
                    return;
                }
                
                const pixels = new Uint8ClampedArray(memory.buffer, ptr, size);
                
                // Create ImageData and render to canvas
                const imageData = new ImageData(pixels, canvas.width, canvas.height);
                ctx.putImageData(imageData, 0, 0);
                
            } catch (error) {
                console.error('Render error:', error);
            }
        }
        
        function renderFallback() {
            // Simple canvas fallback if WASM fails
            ctx.fillStyle = '#1e1e2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#2a2a3e';
            ctx.fillRect(20, 20, canvas.width - 40, canvas.height - 40);
            
            ctx.fillStyle = '#4facfe';
            ctx.font = '24px sans-serif';
            ctx.fillText('ZAPP UI v2', 40, 60);
            
            ctx.fillStyle = '#eee';
            ctx.font = '14px sans-serif';
            ctx.fillText('WASM module not available - showing fallback', 40, 100);
        }
        
        function toggleTheme() {
            if (wasmInstance) {
                wasmInstance.exports.toggleTheme();
                renderUI();
            }
        }
        
        function updateVolume(value) {
            if (wasmInstance) {
                wasmInstance.exports.setVolume(value / 100);
                renderUI();
            }
        }
        
        function updateProgress(value) {
            if (wasmInstance) {
                wasmInstance.exports.setProgress(value / 100);
                renderUI();
            }
        }
        
        function updateEnabled(checked) {
            if (wasmInstance) {
                wasmInstance.exports.setEnabled(checked);
                renderUI();
            }
        }
        
        function exportPNG() {
            const link = document.createElement('a');
            link.download = `zapp-ui-wasm-${Date.now()}.png`;
            link.href = canvas.toDataURL();
            link.click();
        }
        
        // Initialize on load
        init();
    </script>
</body>
</html>
